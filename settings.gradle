pluginManagement {
  plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"

    id 'com.diffplug.spotless' version "${spotlessVersion}"
    id 'com.github.spotbugs' version "${spotbugsPluginVersion}"
    id 'org.sonarqube' version "${sonarqubeVersion}"
    id 'org.springdoc.openapi-gradle-plugin' version "${springdocOpenapiPluginVersion}"

    id 'io.github.ben-manes.versions' version "${versionsPluginVersion}"
    id 'org.cyclonedx.bom' version "${cyclonedxVersion}"
    id 'org.flywaydb.flyway' version "${flywayVersion}"
  }
}

rootProject.name = 'jod-ohjaaja'
