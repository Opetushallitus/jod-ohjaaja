logging:
  level:
    root: INFO
    fi.okm.jod: DEBUG

spring:
  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration
  datasource:
    hikari:
      maximum-pool-size: 3
      schema: ohjaaja
jod:
  cms:
    base-url: http://localhost:8080
  feedback:
    queue-arn: "test-feedback-queue"

management:
  defaults:
    metrics:
      export:
        enabled: false
